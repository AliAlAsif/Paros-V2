  /analytics/comparison:
    get:
      operationId: getComparison
      tags: [analytics]
      summary: Get period-over-period comparison
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, semester]
            default: week
      responses:
        "200":
          description: Comparison data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Folder ───────────────────────────────────────────────────────────────
    Folder:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [academics, research, projects, personal, custom]
        createdAt:
          type: string
          format: date-time

    FolderInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [academics, research, projects, personal, custom]

    FolderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    # ─── Subject ──────────────────────────────────────────────────────────────
    Subject:
      type: object
      required: [id, name, semester, color, isArchived, progress, totalStudyHours, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        semester:
          type: string
        instructorName:
          type: ["string", "null"]
        credits:
          type: ["number", "null"]
        color:
          type: string
        notes:
          type: ["string", "null"]
        progress:
          type: number
          minimum: 0
          maximum: 100
        totalStudyHours:
          type: number
        isArchived:
          type: boolean
        folderId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    SubjectInput:
      type: object
      required: [name, semester, color]
      properties:
        name:
          type: string
          minLength: 1
        semester:
          type: string
        instructorName:
          type: string
        credits:
          type: number
        color:
          type: string
        notes:
          type: string
        folderId:
          type: integer

    SubjectUpdate:
      type: object
      properties:
        name:
          type: string
        semester:
          type: string
        instructorName:
          type: string
        credits:
          type: number
        color:
          type: string
        notes:
          type: string
        progress:
          type: number
        isArchived:
          type: boolean
        folderId:
          type: integer

    # ─── StudySession ─────────────────────────────────────────────────────────
    StudySession:
      type: object
      required: [id, date, startTime, endTime, durationMinutes, sessionType, sessionKind, completionStatus, focusRating, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        durationMinutes:
          type: integer
        sessionType:
          type: string
          enum: ["10min", "30min", "60min", "custom"]
        sessionKind:
          type: string
          enum: [study, research]
        subjectId:
          type: ["integer", "null"]
        researchTopicId:
          type: ["integer", "null"]
        topic:
          type: ["string", "null"]
        goal:
          type: ["string", "null"]
        focusRating:
          type: integer
          minimum: 1
          maximum: 5
        completionStatus:
          type: string
          enum: [completed, partial, cancelled]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    StudySessionInput:
      type: object
      required: [date, startTime, endTime, durationMinutes, sessionType, sessionKind, focusRating, completionStatus]
      properties:
        date:
          type: string
          format: date
        startTime:
