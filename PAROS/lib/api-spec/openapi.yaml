          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
    delete:
      operationId: deleteStudySession
      tags: [study-sessions]
      summary: Delete a study session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /study-sessions/stats/summary:
    get:
      operationId: getStudyStats
      tags: [study-sessions]
      summary: Get aggregated study statistics
      responses:
        "200":
          description: Study statistics
